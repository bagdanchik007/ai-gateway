[tool.poetry]
name = "ai-gateway"
version = "0.1.0"
description = "Production-grade AI Gateway: multi-provider LLM routing, usage tracking, auth, tool calling & RAG ready"
authors = ["Bohdan"]
license = "MIT"
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.139.2"
uvicorn = {extras = ["standard"], version = "^0.51.0"}
pydantic = "^2.13.4"
pydantic-settings = "^2.14.2"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.51"}
asyncpg = "^0.31.0"
alembic = "^1.18.5"
redis = "^8.0.1"
httpx = "^0.28.1"
tenacity = "^9.1.4"
structlog = "^26.1.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
openai = "^2.46.0"
anthropic = "^0.117.0"
tiktoken = "^0.13.0"
python-multipart = "^0.0.32"
sqladmin = "^0.29.0"
email-validator = "^2.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-cov = "^7.1.0"
ruff = "^0.15.22"
mypy = "^2.3.0"
aiosqlite = "^0.22.1"
faker = "^40.31.0"
pre-commit = "^4.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/... in Default-Argumenten ist die idiomatische
# Nutzung des Frameworks, keine echte "mutable default"-Gefahr wie bei list()/dict().
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Security"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q --cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]
